uted);gap:12px}.progress{height:5px;background:#edf1f7;border-radius:10px;margin:14px 0 28px;overflow:hidden}.progress i{display:block;background:var(--blue);height:100%;transition:width .3s}.step-label{color:var(--blue);font-size:12px;font-weight:700}h2.question{font-size:25px;line-height:1.5;margin:9px 0 10px;outline:none}.help{color:var(--muted);margin:0 0 23px;font-size:14px}.options{display:grid;gap:11px}.option{display:flex;align-items:center;gap:16px;border:1px solid var(--line);border-radius:12px;padding:17px 19px;text-align:left;background:white;color:var(--navy);width:100%;transition:.15s}.option:hover{border-color:var(--blue);background:#f5f9ff;transform:translateY(-1px)}.radio{border:1.5px solid #b9c7d9;border-radius:50%;width:19px;height:19px;flex:none}.option strong{display:block;font-weight:650}.option small{display:block;font-size:12px;color:var(--muted);margin-top:3px}.option em{margin-left:auto;font-style:normal;color:#9aabc0}.bottom{display:flex;justify-content:space-between;align-items:center;margin-top:26px;border-top:1px solid var(--line);padding-top:19px;gap:12px}.text-btn{border:0;background:none;color:var(--muted);padding:6px 0}.text-btn:hover{color:var(--blue)}.text-btn:disabled{opacity:.35;cursor:default}.tiny{font-size:12px;color:var(--muted)}.examples{margin-top:22px;font-size:12px;color:var(--muted)}.examples button{border:1px solid var(--line);border-radius:20px;background:white;color:var(--muted);font-size:12px;padding:6px 11px;margin:8px 6px 0 0}.examples button:hover{color:var(--blue);border-color:var(--blue)}.result-head{background:#eef5ff;border:1px solid #d9e7fa;border-radius:13px;padding:22px;margin-bottom:20px}.result-head.warn{background:#fff8ea;border-color:#f1dfb4}.result-head h2{font-size:24px;margin:5px 0 8px}.result-head p{margin:0;color:#51647b;font-size:14px}.pill{font-size:11px;display:inline-block;color:var(--blue);font-weight:700;letter-spacing:1px}.cards{display:grid;gap:14px}.action{border:1px solid var(--line);border-radius:12px;padding:20px}.action h3{font-size:16px;margin:0 0 10px}.action h3 b{font-size:12px;background:#edf4ff;color:var(--blue);padding:3px 7px;border-radius:5px;margin-right:9px}.action ul{padding-left:20px;margin:0;color:#4d6077;font-size:14px}.parallel{color:var(--blue);font-weight:650;font-size:13px;margin:0 0 12px}.warning{background:#fff8ea;border-left:3px solid #dcab46;padding:14px 16px;color:#80602e;font-size:13px;margin:18px 0;border-radius:3px 9px 9px 3px}.buttons{display:flex;gap:10px;flex-wrap:wrap;margin:22px 0}.primary,.secondary{padding:11px 18px;border-radius:9px;border:1px solid var(--blue);background:var(--blue);color:white;font-weight:600}.secondary{background:white;color:var(--blue);border-color:#cfdbec}details{border-top:1px solid var(--line);padding-top:15px;margin-top:15px;font-size:13px;color:var(--muted)}summary{cursor:pointer;color:#4c6078}.history{list-style:none;padding:0}.history li{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid #eef1f6;padding:9px 0}.history button{border:0;background:transparent;color:var(--blue);font-size:12px;flex:none}.history strong{color:#344c69;font-weight:600}.sources a{color:var(--blue);display:block;margin:8px 0}footer{max-width:1160px;margin:26px auto;padding:0 24px 26px;display:flex;justify-content:space-between;gap:20px;color:#8290a2;font-size:11px}#toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);padding:10px 20px;border-radius:9px;background:#102b50;color:white;display:none}textarea.copy{width:100%;height:220px;border:1px solid var(--line);padding:12px;font:13px/1.6 inherit;border-radius:8px}@media(max-width:760px){header{padding:15px 20px}.badge{font-size:10px}main{margin:27px auto;padding:0 16px}h1{font-size:28px}.layout{grid-template-columns:1fr;gap:14px}.side{position:static;padding:15px 18px}.side h2,.side-note{display:none}.stages{display:flex;justify-content:space-between}.stages li{display:block;text-align:center;font-size:11px;padding:0}.stages span{display:block;margin:0 auto 4px}.workspace{padding:24px 20px}h2.question{font-size:22px}.option{padding:15px}.intro{font-size:14px}.result-head h2{font-size:22px}footer{display:block}}@media print{header,.side,.examples,.buttons,.bottom,footer,#toast,.history button{display:none}body{background:white}main{margin:0;padding:0;max-width:none}.layout{display:block}.workspace{border:0;padding:0;box-shadow:none}.action{break-inside:avoid}details{display:block}details>*{display:block!important}}

<body><header><div class="brand"><span class="mark">E</span>电池数字身份</div><span class="badge">销售行动助手 · 交互原型 V1</span></header>
<main><div class="eyebrow">BATTERY PASSPORT & QR CODE</div><h1>这笔业务，接下来做什么？</h1><p class="intro">根据产品与交易安排，逐步判断二维码实施及电池护照工作。每次只回答一个问题，最后获得项目行动清单。</p><div class="layout"><aside class="panel side"><h2>判断路径</h2><ol class="stages" id="stages"></ol><div class="side-note">选择你掌握的业务事实。<br>不清楚的信息可以选择「不确定」。<br><br>本版按明确规则生成结果，尚未接入 AI 知识库；复杂交易进入人工确认。</div></aside><section class="panel workspace" id="app" aria-live="polite"></section></div><div class="examples">先体验一个场景：<br><button data-demo="general">便携式电池出口</button><button data-demo="eve">德国 EVE 进口后销售</button><button data-demo="customer">客户进口成品电池</button><button data-demo="component">交付中间件</button></div></main>
<footer><span>基于 EVE 销售判断流程制作 · 规则讨论稿 · 2026.10</span><span>结果用于内部业务初筛，责任主体需结合实际交易资料核实。</span></footer><div id="toast" role="status"></div>
<script>
const stages=['市场安排','产品类型','交付层级','责任判断','行动清单'];
const o=(value,title,desc='')=>({value,title,desc});
const questions={
market:{stage:0,title:'这批电池是否计划于 2027 年 2 月 18 日及之后，首次投放欧盟市场或投入使用？',help:'包括电池随车辆、设备进入欧盟的情形。进口清关日期可作为辅助信息；此前已清关但尚未投放的，仍需核查实际投放时间。',opts:[o('yes','是','计划在该日及之后首次投放或投入使用'),o('no','否','不进入欧盟，或预计此前已首次投放／投入使用'),o('unknown','不确定','尚未明确市场或时间安排')]},
category:{stage:1,title:'本次交付的电池属于哪一类？',help:'选择产品已确认的电池类别。若分类尚未明确，选择「不确定」，避免凭名称猜测。',opts:[o('ev','电动汽车电池（EV）'),o('lmt','轻型交通工具电池（LMT）'),o('industrial','工业电池','本原型沿用公司“不区分容量推进”的实施口径'),o('portable','便携式电池'),o('sli','SLI 电池','启动、照明、点火'),o('unknown','不确定产品类别')]},
component:{stage:2,title:'本次交付的电芯或模组，是否用于后续再组装成更大的电池？',help:'结合交付规格和后续用途确认。产品叫 Cell、Module 或 Pack，本身不能单独决定是否属于中间件。',opts:[o('yes','是，交付后还需要再组装','交付层级和客户最终电池层级不同'),o('no','否，本次交付的是相应成品电池'),o('unknown','不确定','需要客户或技术团队确认用途')]},
origin:{stage:3,title:'本次判断的成品电池在哪里制造？',help:'这里关注相应成品电池的制造地，而非电芯原产地。',opts:[o('outside','欧盟以外制造，随后进口欧盟'),o('eu','欧盟境内制造','例如匈牙利工厂生产相应成品电池'),o('unknown','不确定')]},
importer:{stage:3,title:'哪一方是这批电池的实际进口主体？',help:'关注实际进口交易中的公司主体。代办报关的货代、报关行，与实际进口商可能不同；无法区分时请选择「不确定」。',opts:[o('eve','EVE 欧盟实体'),o('customer','客户或其他欧盟实体'),o('agent','只知道由货代／代理清关'),o('unknown','不确定实际进口主体')]},
role:{stage:3,title:'上述进口主体是否实际采购／承接这批电池，用于欧盟销售或使用？',help:'这一题核对其实际交易角色。仅安排运输、代办清关或提供仓储，不足以确认其护照责任。',opts:[o('yes','是，实际承接进口并销售或使用'),o('no','否，只提供代办清关／物流等服务'),o('unknown','不确定')]},
supplier:{stage:3,title:'谁首次在欧盟供应这批成品电池？',help:'包括向经销商或使用方销售、交付及免费供应。若尚未对外供应、直接自用，选择最后一项。',opts:[o('eve','EVE 欧盟实体'),o('customer','客户或其他主体'),o('self','没有先对外供应，直接自用'),o('unknown','不确定')]},
self:{stage:3,title:'谁将在欧盟首次按预定用途使用这批电池？',help:'仅适用于此前没有投放市场、直接投入使用的情形。自用场景在本原型中单独提交确认。',opts:[o('eve','EVE 实体'),o('customer','客户或其他主体'),o('unknown','不确定')]},
special:{stage:3,title:'是否存在以下需要进一步核查的安排？',help:'客户贴牌／委托制造；进口主体与首次供应主体不一致；境外直销终端用户；特殊海关程序；或其他角色不清的安排。',opts:[o('no','没有，交易安排清楚且资料一致'),o('yes','有其中一项或多项'),o('unknown','不确定，需要核对资料')]}
};
let answers={},path=[],current='market',lastResult=null;
function next(id,v){if(v==='unknown')return 'result';switch(id){case'market':return v==='yes'?'category':'result';case'category':return ['portable','sli'].includes(v)?'result':'component';case'component':return v==='no'?'origin':'result';case'origin':return v==='outside'?'importer':'supplier';case'importer':return ['eve','customer'].includes(v)?'role':'result';case'role':return v==='yes'?'supplier':'result';case'supplier':return v==='self'?'self':'special';case'self':return 'result';case'special':return 'result';}}
function choose(v){answers[current]=v;path.push(current);current=next(current,v);render(true)}
function jump(i){current=path[i];for(const id of path.slice(i))delete answers[id];path=path.slice(0,i);render(true)}
function reset(){answers={};path=[];current='market';render(true)}
function back(){if(path.length)jump(path.length-1)}
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function history(){return '<ul class="history">'+path.map((id,i)=>'<li><div>'+esc(questions[id].title)+'<br><strong>'+esc(questions[id].opts.find(x=>x.value===answers[id]).title)+'</strong></div><button data-jump="'+i+'">修改</button></li>').join('')+'</ul>'}
const physical=['确认是否需要 EVE 喷印，以及 Cell / Module / Pack / System 的赋码层级。','确认二维码生成规则、码的提供方和产线喷印安排。','按客户指定要求实施；客户暂无规则时先完成需求确认。'];
const data=['按客户需求确认护照交付字段。','明确接口方式、交付时间与双方对接人。','优先使用 EVE 标准化 API 接口；其他方式按项目确认。'];
function outcome(){
let r={kind:'review',label:'需要补充确认',title:'先补齐信息，再确定实施路径',desc:'当前信息不足以形成完整结论。已回答的信息会保留在下方。',cards:[],notes:[]};
const unknown=path.find(id=>answers[id]==='unknown');
if(unknown){r.cards=[['需要确认的事项',[questions[unknown].title,'向客户及相关技术、关务或法务同事核实后，返回本题继续判断。']]];return r}
if(answers.market==='no'){r.title='先确认市场与实际投放时间';r.desc='暂不进入本版后续实施判断，不直接据此作出法规豁免结论。';r.cards=[['下一步',['确认是否最终进入欧盟，包括随车辆或设备出口。','如以适用日前已投放为依据，核对并留存相应交易及供应证据。','客户合同另有二维码或数据要求的，仍需按项目确认。']]];return r}
if(['portable','sli'].includes(answers.category)){return {kind:'ready',label:'一般二维码路径',title:'按 EVE 规则实施一般二维码',desc:'本场景沿用公司一般二维码流程，无需进入本工具的护照责任主体判断。',cards:[['一般二维码实施',['按 EVE 规则贴码／喷码。','通过一般二维码平台填报对应信息。','客户有额外信息或数据要求的，另行确认。']]],notes:[]}}
if(answers.component!=='no'){r.title='先向客户确认中间件实施要求';r.desc='本次交付用于后续再组装，需确认交付层级上的赋码及护照资料要求。';r.cards=[['客户确认事项',['是否需要在本次交付的中间件上赋码。','如需赋码，确认码规则、提供方及喷印层级。','是否需要 EVE 提供电池护照资料，明确字段与交付方式。']]];r.notes=['法规解释与海关执行可能存在差异，请结合客户确认及内部合规意见落实。'];return r}
if(answers.self){r.title='直接自用场景：确认首次投入使用责任';r.desc='拟首次使用方：'+(answers.self==='eve'?'EVE 实体':'客户或其他主体')+'。该场景需核实此前未投放市场及实际投入使用安排。';r.cards=[['确认后再确定护照安排',['核实首次使用的具体法人主体及项目地点。','核实电池此前是否已经投放欧盟市场。','由内部合规团队确认护照责任与实施分工。']]];return r}
if(answers.importer==='agent'||answers.role==='no'){r.title='清关代理不能直接作为责任判断依据';r.desc='需要继续识别实际进口及首次供应主体。';r.cards=[['请补充交易信息',['向关务确认报关代理代表哪家公司办理进口。','核对采购、销售合同及实际供应链。','确认实际进口主体后，返回修改答案。']]];return r}
let mismatch=answers.origin==='outside'&&answers.importer!==answers.supplier;
if(answers.special!=='no'||mismatch){r.title='交易角色需要进一步核实';r.desc=mismatch?'实际进口主体与首次供应主体不一致，暂不自动指定护照责任主体。':'存在特殊安排，请核实交易角色后明确责任分工。';r.cards=[['需提供给内部合规团队的信息',['实际交易链及各公司全称。','进口申报信息及报关代理关系。','合同、交付安排及客户贴牌／委托制造情况。']]];return r}
if(answers.supplier==='eve')r={kind:'ready',label:'EVE 承担责任 · 初步判断',title:'按 EVE 规则实施电池护照二维码',desc:'根据所选常规交易安排，初步识别 EVE 欧盟实体为首次投放主体。',cards:[['EVE 护照实施',['确定赋码层级：Cell / Module / Pack / System。','按 EVE 二维码生成规则实施贴码／喷码。','组织护照信息填报、发布、运营及维护。']]],notes:[]};
else r={kind:'ready',label:'客户／其他主体承担责任 · 初步判断',title:'物理二维码与护照数据交付并行推进',desc:'根据所选常规交易安排，初步识别客户或其他主体为首次投放主体。',parallel:true,cards:[['按客户规则实施物理二维码（如有）',physical],['电池护照数据交付',data]],notes:[]};
if(answers.category==='industrial')r.notes.push('工业电池本版按 EVE“不区分容量推进”的内部口径展示行动。法规强制护照范围为容量大于 2 kWh 的工业电池；较小容量应另行核定适用要求。');
r.notes.push('责任主体与受托执行方可以不同。若客户书面委托 EVE 运营护照，另行明确授权范围与实施分工。');return r;
}
function resultText(r){return ['电池数字身份 · 项目判断结果',r.title,r.desc,...r.cards.flatMap(([t,items])=>['',t,...items.map(x=>'• '+x)]),'',...r.notes,'','判断记录',...path.map(id=>questions[id].title+' '+questions[id].opts.find(x=>x.value===answers[id]).title),'','本结果为业务初筛，需结合实际交易资料核实。'].join('\n')}
function render(focus=false){const result=current==='result';const s=result?4:questions[current].stage;document.querySelector('#stages').innerHTML=stages.map((x,i)=>'<li class="'+(i===s?'active':i<s?'done':'')+'"><span>'+(i<s?'✓':i+1)+'</span>'+x+'</li>').join('');const app=document.querySelector('#app');
if(!result){let q=questions[current];app.innerHTML='<div class="topline"><span>逐步判断 · '+stages[q.stage]+'</span><span>已回答 '+path.length+' 项</span></div><div class="progress"><i style="width:'+((s+0.5)/5*100)+'%"></i></div><div class="step-label">'+String(s+1).padStart(2,'0')+' / '+stages[s]+'</div><h2 class="question" tabindex="-1">'+q.title+'</h2><p class="help">'+q.help+'</p><div class="options">'+q.opts.map(x=>'<button class="option" data-value="'+x.value+'"><span class="radio"></span><span><strong>'+x.title+'</strong>'+(x.desc?'<small>'+x.desc+'</small>':'')+'</span><em>›</em></button>').join('')+'</div><div class="bottom"><button class="text-btn" id="back" '+(!path.length?'disabled':'')+'>← 上一步</button><span class="tiny">选择后自动进入下一步</span></div>';
}else{let r=outcome();lastResult=r;app.innerHTML='<div class="topline"><span>判断完成</span><span>共 '+path.length+' 项业务信息</span></div><div class="progress"><i style="width:100%"></i></div><div class="result-head '+(r.kind==='review'?'warn':'')+'"><span class="pill">'+r.label+'</span><h2 class="question" tabindex="-1">'+r.title+'</h2><p>'+r.desc+'</p></div>'+(r.parallel?'<p class="parallel">以下两项工作需并行推进</p>':'')+'<div class="cards">'+r.cards.map(([t,items],i)=>'<article class="action"><h3><b>'+String(i+1).padStart(2,'0')+'</b>'+t+'</h3><ul>'+items.map(x=>'<li>'+x+'</li>').join('')+'</ul></article>').join('')+'</div>'+r.notes.map(n=>'<div class="warning">'+n+'</div>').join('')+'<div class="buttons"><button class="primary" id="copy">复制判断结果</button><button class="secondary" id="print">打印 / 存为 PDF</button><button class="secondary" id="reset">重新判断</button></div><div id="copybox"></div><details open><summary>查看判断记录 · 可返回修改</summary>'+history()+'</details><details class="sources"><summary>判断依据与原型边界</summary><p>依据《电池法规》第 3 条、第 13(6) 条及第 77 条，以及欧委会《蓝色指南》关于投放市场及进口的解释。二维码和数据实施清单沿用公司提供的定稿流程。</p><p>本版为规则原型，尚未接入企业系统或 AI。复杂角色安排、中间件及直接自用场景进入人工确认；结果不替代项目责任认定。一般二维码页面为公司实施指引，不涵盖各子类全部信息要求。</p><a href="https://eur-lex.europa.eu/eli/reg/2023/1542" target="_blank" rel="noopener">《欧盟电池法规》2023/1542 ↗</a><a href="https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:52022XC0629(04)" target="_blank" rel="noopener">欧委会《蓝色指南》2022 ↗</a></details>';}
app.querySelectorAll('[data-value]').forEach(b=>b.onclick=()=>choose(b.dataset.value));app.querySelectorAll('[data-jump]').forEach(b=>b.onclick=()=>jump(Number(b.dataset.jump)));if(!result)app.querySelector('#back').onclick=back;else{app.querySelector('#reset').onclick=reset;app.querySelector('#print').onclick=()=>window.print();app.querySelector('#copy').onclick=copyResult;}if(focus)app.querySelector('.question').focus({preventScroll:true});}
async function copyResult(){const text=resultText(lastResult);try{await navigator.clipboard.writeText(text);const toast=document.querySelector('#toast');toast.textContent='判断结果已复制';toast.style.display='block';setTimeout(()=>toast.style.display='none',2200)}catch(e){document.querySelector('#copybox').innerHTML='<p class="tiny">浏览器未允许自动复制，请长按或全选下方内容复制：</p><textarea class="copy" readonly aria-label="判断结果">'+esc(text)+'</textarea>';document.querySelector('textarea.copy').select()}}
const demos={general:['yes','portable'],eve:['yes','industrial','no','outside','eve','yes','eve','no'],customer:['yes','ev','no','outside','customer','yes','customer','no'],component:['yes','ev','yes']};
document.querySelectorAll('[data-demo]').forEach(b=>b.onclick=()=>{answers={};path=[];current='market';for(const v of demos[b.dataset.demo]){answers[current]=v;path.push(current);current=next(current,v)}render(true);document.querySelector('#app').scrollIntoView({behavior:'smooth',block:'start'})});
render();
</script></body></html>
